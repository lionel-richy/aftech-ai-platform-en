[pytest]
# "session": a single event loop for the whole test suite — needed to
# safely reuse the cached asyncpg engine (see app/db/session.py) across
# several async tests (test_db_*.py). Does not affect the existing
# synchronous tests (FakeRagEngine, etc.).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
